name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BichonDesktopPet.sln

      - name: Build
        run: dotnet build BichonDesktopPet.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test BichonDesktopPet.sln --configuration Release --no-build
